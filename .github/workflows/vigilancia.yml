name: Vigilar la app publicada

# Comprueba lo que la app SIRVE DE VERDAD, no lo que hay en el repositorio.
# Un despliegue puede publicar datos degradados con el repo impecable: pasó dos
# veces el 30/8/2026. Si algo falla, abre una incidencia con el diagnóstico
# entero dentro, para no tener que pedirlo desde el móvil.
on:
  schedule:
    - cron: '40 6,18 * * *'    # una hora después de cada actualización de datos
  workflow_run:
    workflows: ["Publicar la app"]
    types: [completed]
  workflow_dispatch:
    inputs:
      probar_alarma:
        description: 'Fallar a propósito para comprobar que la alarma suena'
        type: boolean
        default: false

permissions:
  contents: write   # para poder commitear el historial de salud
  issues: write

# Una vigilancia cada vez: si se solapan, una puede cerrar la incidencia que la
# otra acaba de abrir.
concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    # Solo tras un despliegue que ha PUBLICADO: con uno cancelado o fallido
    # (cancel-in-progress en deploy.yml) miraba la versión anterior, que está
    # sana, y cerraba la incidencia abierta. Y eran ~20 corridas los días de
    # muchos pushes, que llenaban la ventana de 40 filas del historial.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Tope del JOB entero: los pasos con red ya lo tenían, pero las pruebas,
    # la compilación o Pages podían colgar el runner seis horas.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # node_modules ENTERO, por hash del lockfile. La cache de npm de
      # setup-node solo guarda las descargas: medido, npm ci seguia en 3,7-4,7
      # minutos con ella (despliegue 99, vigilancia 77). Con node_modules
      # guardado, el paso se salta. npm ci BORRA node_modules antes de
      # instalar, asi que solo corre si la cache no ha traido nada.
      - id: modulos
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modulos-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - if: steps.modulos.outputs.cache-hit != 'true'
        run: npm ci

      # 1) El motor sigue siendo correcto.
      - name: Pruebas
        id: pruebas
        # shell: bash trae -o pipefail: sin eso el paso devolvia el codigo de
        # `tee` y un npm test en rojo nunca abria incidencia.
        shell: bash
        run: npm test 2>&1 | tee /tmp/pruebas.txt

      # 2) Y lo publicado está sano. Se reintenta: justo después de un
      #    despliegue, Pages puede tardar en servir lo nuevo.
      - name: Diagnóstico de lo publicado
        id: diag
        run: |
          # Un vigilante que nunca se ha visto saltar no es un vigilante. Con
          # esta entrada se puede provocar el fallo y comprobar que abre la
          # incidencia de verdad, sin esperar a que la app se rompa sola.
          if [ "${{ inputs.probar_alarma }}" = "true" ]; then
            echo "PRUEBA DE ALARMA: fallo provocado a proposito, la app esta bien" | tee /tmp/diagnostico.txt
            exit 1
          fi
          # Cada intento escribe SU fila a un temporal y solo el que decide la
          # pasa al historial: antes el intento bueno volvia a ejecutar el
          # diagnostico entero solo para anotar la fila, y si esa segunda
          # pasada fallaba (Pages parpadea) el paso salia en rojo DESPUES de
          # haber dicho estado=bien.
          for intento in 1 2 3; do
            rm -f /tmp/fila.jsonl
            if node scripts/diagnostico.mjs --historial /tmp/fila.jsonl > /tmp/diagnostico.txt 2>&1; then
              echo "estado=bien" >> "$GITHUB_OUTPUT"
              cat /tmp/fila.jsonl >> historial/salud.jsonl
              cat /tmp/diagnostico.txt
              exit 0
            fi
            echo "intento $intento sin éxito; espero"
            [ "$intento" != "3" ] && sleep 45
          done
          echo "estado=mal" >> "$GITHUB_OUTPUT"
          [ -f /tmp/fila.jsonl ] && cat /tmp/fila.jsonl >> historial/salud.jsonl
          cat /tmp/diagnostico.txt
          exit 1

      # Cada corrida deja una fila con las cifras. Un informe suelto dice si hoy
      # esta bien; cien informes dicen QUE SE ESTA MOVIENDO -la cobertura que
      # baja poco a poco, el ruido que sube, los datos que envejecen porque la
      # actualizacion lleva dias fallando-. Eso es lo que se puede mirar antes
      # de decidir que va en la version siguiente.
      #
      # Se commitea SIEMPRE, tanto si el diagnostico ha pasado como si no: las
      # corridas malas son justo las que hay que poder mirar despues.
      - name: Guardar la fila en el historial
        if: always()
        continue-on-error: true
        run: |
          if [ -s historial/salud.jsonl ] && ! git diff --quiet -- historial/salud.jsonl; then
            git config user.name  "vigilancia-bot"
            git config user.email "vigilancia-bot@users.noreply.github.com"
            git add historial/salud.jsonl
            git commit -m "salud: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Otra corrida puede haber commiteado mientras: se rebasa y se
            # reintenta en vez de perder la fila.
            # Si fallan los tres intentos el paso sale EN ROJO: antes el ultimo
            # mandato del bucle era `sleep` y el estado era 0, o sea la corrida
            # perdida en silencio que este bucle venia a evitar.
            subido=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && { subido=1; break; }
              sleep 5
            done
            [ "$subido" = 1 ] || { echo "::error::push rechazado tres veces"; exit 1; }
          fi

      - name: Abrir incidencia si algo falla
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // github-script v9 es ESM: aquí ya no existe require().
            const fs = await import('node:fs');
            const leer = (f) => { try { return fs.readFileSync(f, 'utf8').slice(-5000); } catch { return '(sin salida)'; } };
            const cuerpo = [
              'La vigilancia automática ha encontrado algo. Esto NO lo ha pulsado nadie:',
              'lo ha detectado la comprobación programada contra la app publicada.',
              '',
              '## Diagnóstico de lo publicado', '```', leer('/tmp/diagnostico.txt'), '```',
              '## Pruebas', '```', leer('/tmp/pruebas.txt'), '```',
              '',
              `[Ver la ejecución](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const titulo = 'Vigilancia: la app publicada falla';
            const abiertas = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'vigilancia',
            });

            // Se reutiliza la incidencia abierta en vez de crear una por
            // ejecución: doce avisos al día del mismo problema no son doce
            // problemas, y enterrarían el que sí importa.
            if (abiertas.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: abiertas.data[0].number, body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: titulo, body: cuerpo, labels: ['vigilancia'],
              });
            }

      - name: Cerrar la incidencia si ya está sano
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const abiertas = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'vigilancia',
            });
            for (const inc of abiertas.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: inc.number,
                body: 'Resuelto: la vigilancia vuelve a pasar sin fallos.',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: inc.number, state: 'closed', state_reason: 'completed',
              });
            }
