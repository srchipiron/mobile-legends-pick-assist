name: Vigilar la app publicada

# Lo que la app SIRVE DE VERDAD, no lo que hay en el repositorio (dos veces el
# repo estaba impecable y lo publicado roto). Si algo falla, abre una
# incidencia con el diagnóstico dentro; cuando vuelve a pasar, la cierra.
on:
  schedule:
    - cron: '40 6,18 * * *'    # una hora después de cada actualización de datos
  workflow_run:
    workflows: ["Publicar la app"]
    types: [completed]
  workflow_dispatch:
    inputs:
      probar_alarma:
        description: 'Fallar a propósito para comprobar que la alarma suena'
        type: boolean
        default: false

permissions:
  contents: write   # para commitear el historial de salud
  issues: write

# Una cada vez: si se solapan, una puede cerrar la incidencia que la otra acaba de abrir.
concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    # Solo tras un despliegue que PUBLICÓ: con uno cancelado miraba la versión anterior y cerraba la incidencia.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/instalar

      - name: Pruebas
        id: pruebas
        # bash trae pipefail: sin él el paso devolvía el código de `tee`.
        shell: bash
        run: npm test 2>&1 | tee /tmp/pruebas.txt

      - name: Diagnóstico de lo publicado
        id: diag
        # También con las pruebas en rojo (las corridas malas son las que necesitan fila); no si se canceló.
        # Hasta tres intentos (Pages tarda tras un despliegue); el que decide deja SU fila, también la mala.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "${{ inputs.probar_alarma }}" = "true" ]; then
            echo "PRUEBA DE ALARMA: fallo provocado a proposito, la app esta bien" | tee /tmp/diagnostico.txt
            exit 1
          fi
          for intento in 1 2 3; do
            rm -f /tmp/fila.jsonl
            if node scripts/diagnostico.mjs --historial /tmp/fila.jsonl > /tmp/diagnostico.txt 2>&1; then
              cat /tmp/fila.jsonl >> historial/salud.jsonl
              cat /tmp/diagnostico.txt
              exit 0
            fi
            echo "intento $intento sin éxito; espero"
            [ "$intento" != "3" ] && sleep 45
          done
          [ -f /tmp/fila.jsonl ] && cat /tmp/fila.jsonl >> historial/salud.jsonl
          cat /tmp/diagnostico.txt
          exit 1

      - name: Guardar la fila en el historial
        id: guardar
        # Siempre; un push perdido no es «la app falla», pero los avisos miran `steps.guardar.outcome`.
        if: always()
        continue-on-error: true
        run: |
          if [ -s historial/salud.jsonl ] && ! git diff --quiet -- historial/salud.jsonl; then
            git config user.name  "vigilancia-bot"
            git config user.email "vigilancia-bot@users.noreply.github.com"
            git add historial/salud.jsonl
            git commit -m "salud: $(date -u +%Y-%m-%dT%H:%MZ)"
            bash scripts/bots/subir.sh origin HEAD:main
          fi

      # Tras guardar (lee la fila de esta corrida): datos de más de 72 h abren la incidencia de siempre.
      - name: Datos sin actualizar
        id: rancios
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/datos-rancios.mjs historial/salud.jsonl 2>&1 | tee /tmp/rancios.txt

      # Las caras del lector, al día con las del juego (no va en npm test: tiraría el despliegue).
      - name: Caras nuevas en el juego
        id: caras
        if: ${{ !cancelled() }}
        shell: bash
        run: node scripts/caras-nuevas.mjs 2>&1 | tee /tmp/caras.txt

      - name: Abrir incidencia si algo falla
        if: ${{ failure() || steps.guardar.outcome == 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILA_PERDIDA: ${{ steps.guardar.outcome == 'failure' }}
          RANCIOS: ${{ steps.rancios.outcome == 'failure' }}
          CARAS: ${{ steps.caras.outcome == 'failure' }}
        with:
          script: |
            const { vigilancia } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/bots/incidencia.mjs`);
            const si = (v) => process.env[v] === 'true';
            await vigilancia({ github, context, mal: true, filaPerdida: si('FILA_PERDIDA'), rancios: si('RANCIOS'), caras: si('CARAS') });

      - name: Cerrar la incidencia si ya está sano
        if: ${{ success() && steps.guardar.outcome != 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { vigilancia } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/bots/incidencia.mjs`);
            await vigilancia({ github, context, mal: false });
