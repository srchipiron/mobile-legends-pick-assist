# La APK del lector (android/, Lector MLBB): se compila aquí y se publica
# como release `lector-v<versión>` con el asset `lector-mlbb.apk`, que la
# tablet instala y con el que se actualiza sola.
#
# - Push a main con algo de lo que va dentro: compila y PUBLICA.
# - A mano (workflow_dispatch): solo compila y deja la APK como artefacto,
#   salvo que se marque «publicar». Así se puede compilar una rama.
#
# La FIRMA es siempre la misma (android/firma.jks.cifrado, descifrada con el
# secreto LECTOR_FIRMA_CLAVE, alias `lector`): con otra, Android no deja
# actualizar sin desinstalar y Javi perdería lo aprendido, sus partidas y el
# vínculo. Si falta el fichero o el secreto, la corrida FALLA: nunca crea
# otra clave.
name: APK del lector

on:
  push:
    branches: [main]
    # Todo lo que `copiarLector` mete en la APK menos los datos (la APK los baja sola).
    paths: ['android/**', 'scripts/lector/**', 'src/motor/**', 'src/comun/**', 'public/comunidad.json', '.github/workflows/apk.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar la release (si no, solo compila y deja la APK como artefacto)'
        type: boolean
        default: false

# Publicar la release.
permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22 y node_modules en caché (la acción de todos los workflows).
      - uses: ./.github/actions/instalar
      # Las pruebas ANTES de compilar: una APK con las pruebas en rojo no sale.
      - name: Pruebas (npm test)
        run: npm test
      - name: La firma de siempre (si falta, se para)
        env:
          CLAVE: ${{ secrets.LECTOR_FIRMA_CLAVE }}
        run: |
          set -euo pipefail
          if [ -z "$CLAVE" ] || [ ${#CLAVE} -lt 20 ]; then
            echo "::error::Falta el secreto LECTOR_FIRMA_CLAVE (20 caracteres o más). Sin él la APK saldría con otra firma y no se podría actualizar."
            exit 1
          fi
          if [ ! -f android/firma.jks.cifrado ]; then
            echo "::error::Falta android/firma.jks.cifrado: es la clave de firma de la APK publicada. Recupérala del historial de git; NO crees otra (la tablet no podría actualizarse sin desinstalar)."
            exit 1
          fi
      - name: Node embebido (nodejs-mobile 18.20.4)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o nm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          # [D] Lo que va dentro de la APK firmada no puede cambiar sin que se vea.
          echo "bd7321eaa1a7602fbe0bb87302df2d79d87835cf4363fbdd17c350dbb485c2af  nm.zip" | sha256sum -c -
          mkdir -p android/app/libnode
          unzip -q nm.zip -d android/app/libnode
          test -f android/app/libnode/bin/arm64-v8a/libnode.so
      - name: NDK y CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Compilar y firmar
        env:
          CLAVE: ${{ secrets.LECTOR_FIRMA_CLAVE }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/firma.jks.cifrado -out "$RUNNER_TEMP/firma.jks" -pass env:CLAVE
          cd android
          LECTOR_FIRMA="$RUNNER_TEMP/firma.jks" LECTOR_FIRMA_CLAVE="$CLAVE" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/firma.jks"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lector-mlbb.apk"
      - name: La APK como artefacto (compilada a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lector-mlbb
          path: ${{ runner.temp }}/lector-mlbb.apk
          if-no-files-found: error
      - name: Publicar
        if: github.event_name == 'push' || inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="lector-v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/lector-mlbb.apk" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/lector-mlbb.apk" --title "Lector MLBB $VERSION" --notes "La app del lector para la tablet. Instálala desde el navegador de la tablet: descarga lector-mlbb.apk y ábrela." --latest
          fi
