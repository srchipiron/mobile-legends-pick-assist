# La APK del lector para la tablet (3.61.0, android/): se compila aquí y se
# publica como «release» de GitHub para instalarla desde el navegador de la
# tablet, sin ordenador. Corre cuando cambia lo que va dentro (la app de
# Android, el lector o el motor que importa) y a mano.
#
# La FIRMA tiene que ser siempre la misma o Android no deja actualizar sin
# desinstalar (y se perdería lo aprendido en la tablet). La contraseña la
# inventa Javi y solo vive en el secreto LECTOR_FIRMA_CLAVE: nadie más la
# ve, tampoco quien programa. La primera corrida con el secreto CREA la
# clave de firma, la guarda cifrada con esa contraseña
# (android/firma.jks.cifrado) y la sube al repositorio; las siguientes la
# descifran. Sin el secreto no se publica nada.
name: APK del lector

on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/lector/**', 'src/motor/**', '.github/workflows/apk.yml']
  workflow_dispatch:

# Publicar la release, y la primera vez subir la clave de firma cifrada.
permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: ¿Está la contraseña de la firma?
        env:
          CLAVE: ${{ secrets.LECTOR_FIRMA_CLAVE }}
        run: |
          set -euo pipefail
          if [ -z "$CLAVE" ]; then
            echo "::error::Falta el secreto LECTOR_FIRMA_CLAVE (Settings → Secrets and variables → Actions). Sin él la APK saldría con otra firma y no se podría actualizar."
            exit 1
          fi
      - name: La clave de firma (se crea la primera vez)
        env:
          CLAVE: ${{ secrets.LECTOR_FIRMA_CLAVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ${#CLAVE} -lt 20 ]; then
            echo "::error::La contraseña de LECTOR_FIRMA_CLAVE es corta: pon 20 caracteres o más, al azar."
            exit 1
          fi
          if [ ! -f android/firma.jks.cifrado ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/nueva.jks" -storetype PKCS12 -alias lector -keyalg RSA -keysize 4096 -validity 20000 -storepass:env CLAVE -keypass:env CLAVE -dname "CN=Lector MLBB"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/nueva.jks" -out android/firma.jks.cifrado -pass env:CLAVE
            rm -f "$RUNNER_TEMP/nueva.jks"
            # Al repositorio por la API (sin guardar el token en .git): solo este fichero, cifrado.
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/android/firma.jks.cifrado" -f message="APK: la clave de firma del lector, cifrada" -f content="$(base64 -w0 android/firma.jks.cifrado)" -f branch=main > /dev/null
            echo "Clave de firma creada y guardada cifrada en android/firma.jks.cifrado."
          fi
      - name: Node embebido (nodejs-mobile 18.20.4)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o nm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          # La suma conocida (21 de octubre de 2026): lo que va dentro de la APK firmada no puede cambiar sin que se vea.
          echo "bd7321eaa1a7602fbe0bb87302df2d79d87835cf4363fbdd17c350dbb485c2af  nm.zip" | sha256sum -c -
          mkdir -p android/app/libnode
          unzip -q nm.zip -d android/app/libnode
          test -f android/app/libnode/bin/arm64-v8a/libnode.so
      - name: NDK y CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Compilar y firmar
        env:
          CLAVE: ${{ secrets.LECTOR_FIRMA_CLAVE }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/firma.jks.cifrado -out "$RUNNER_TEMP/firma.jks" -pass env:CLAVE
          cd android
          LECTOR_FIRMA="$RUNNER_TEMP/firma.jks" LECTOR_FIRMA_CLAVE="$CLAVE" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/firma.jks"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lector-mlbb.apk"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="lector-v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/lector-mlbb.apk" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/lector-mlbb.apk" --title "Lector MLBB $VERSION" --notes "La app del lector para la tablet. Instálala desde el navegador de la tablet: descarga lector-mlbb.apk y ábrela." --latest
          fi
