name: Mantenimiento automático

# Lo que no lleva criterio humano se regenera solo y se propone en un pull
# request; lo que lo lleva (los tags de un héroe nuevo o rehecho) se avisa.
on:
  schedule:
    - cron: '20 7 * * 1'      # lunes por la mañana
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Una cada vez: dos a la vez empujarían la misma rama con -f.
concurrency:
  group: mantenimiento
  cancel-in-progress: false

jobs:
  mantener:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/instalar

      # Los datos de hoy (de ahí salen las etiquetas de Moonton), a un temporal y con el comparador:
      # los pasos de abajo leen public/data, y una corrida degradada derivaría tablas de basura.
      - name: Ingesta
        id: ingesta
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/ingest.mjs --rank glory --days 7 --out /tmp/nueva.json

      - name: Usar la corrida solo si no empeora la guardada
        run: |
          if [ "${{ steps.ingesta.outcome }}" = "success" ] \
             && node scripts/comparar-ingesta.mjs /tmp/nueva.json public/data/roam-meta.json; then
            cp /tmp/nueva.json public/data/roam-meta.json
          else
            echo "::warning::La ingesta ha fallado o resuelve menos; el mantenimiento sigue con los datos del repositorio."
          fi

      # Héroes nuevos y kits rehechos: se avisa (sin duplicar el título abierto), NO se les inventan tags.
      - name: Avisar de héroes sin tags o con el kit rehecho
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = await import('node:fs');
            const { mantenimiento } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/bots/incidencia.mjs`);
            await mantenimiento({ github, context, meta: JSON.parse(fs.readFileSync('./public/data/roam-meta.json', 'utf8')) });

      # Las tablas derivadas sí se regeneran solas (salen del catálogo); si cambian, se proponen.
      - name: Regenerar tablas de deducción
        id: tablas
        timeout-minutes: 15
        run: |
          node scripts/derivar-tags.mjs > /tmp/tablas.txt || {
            echo "::warning::no se pudieron derivar las tablas (mira el log de arriba); no es un fallo del código"; exit 0; }
          node scripts/bots/sustituir-tablas.mjs /tmp/tablas.txt src/motor/reglas.js

      # Nada se propone sin pasar las pruebas: una tabla regenerada también puede romper una invariante.
      - name: Pruebas
        if: steps.tablas.outputs.cambio == 'true'
        run: npm test

      # Con git y gh, no con una acción de terceros con permiso de escritura.
      - name: Proponer el cambio
        if: steps.tablas.outputs.cambio == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RAMA=mantenimiento/tablas-de-tags
          git config user.name  "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          git checkout -B "$RAMA"
          git add src/motor/reglas.js
          git commit -m "regenerar SPECIALITY_TAGS y ROLE_VETO del catalogo"
          git push -f -u origin "$RAMA"
          if [ -z "$(gh pr list --head "$RAMA" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$RAMA" --base main \
              --title "Tablas de deducción regeneradas del catálogo" \
              --body "\
          \`scripts/derivar-tags.mjs\` produce tablas distintas a las de \`reglas.js\`.
          Pasa cuando crece el catálogo o Moonton cambia sus etiquetas, que es
          exactamente cuando toca regenerarlas.

          No llevan criterio humano: salen de qué tags tienen en el catálogo los
          héroes que llevan cada etiqueta. Las pruebas ya han pasado con ellas.

          Antes de fusionar, mirar que la medición documentada en el comentario
          de \`SPECIALITY_TAGS\` siga cuadrando."
          fi
