name: Claude a petición

# Claude trabaja sobre una incidencia o un pull request cuando Javi lo llama
# con @claude (cada ejecución cuesta dinero de su clave). Apagado mientras no
# exista el secreto ANTHROPIC_API_KEY: avisa en el registro y no gasta nada.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

# contents: write para crear la RAMA de trabajo; propone, nunca escribe en
# main. Proteger `main` en Settings es decisión de Javi (obligaría a todo PR).
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    timeout-minutes: 60
    # Solo el dueño, con «@claude» en SU comentario (no en el cuerpo) o asignándolo; nunca en las
    # incidencias que escribe la app con su token (pantalla, partidas, vigilancia) ni en las del
    # bot del modelo: su texto viene de fuera y para GitHub son «del dueño».
    if: |
      github.event.sender.login == github.repository_owner &&
      !contains(join(github.event.issue.labels.*.name, ','), 'pantalla') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'partidas') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'vigilancia') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'modelo') &&
      (contains(github.event.comment.body, '@claude') ||
       github.event.action == 'assigned')
    runs-on: ubuntu-latest
    env:
      TIENE_CLAVE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Sin clave no hay nada que hacer
        if: env.TIENE_CLAVE != 'true'
        run: |
          echo "::notice::Falta el secreto ANTHROPIC_API_KEY."
          echo "Se añade en Settings -> Secrets and variables -> Actions."
          echo "Hasta entonces este workflow no hace nada, y no gasta nada."

      - if: env.TIENE_CLAVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - if: env.TIENE_CLAVE == 'true'
        uses: ./.github/actions/instalar

      - if: env.TIENE_CLAVE == 'true'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Trabaja en una rama propia y propone; nunca escribe en main.
          base_branch: main
          branch_prefix: claude/
          # Nada de red ni de comandos sueltos: leer, escribir y las
          # comprobaciones del proyecto. WebFetch queda fuera a propósito, y el
          # diagnóstico solo contra public/data (--local): con una --url
          # cualquiera sería una salida a la red.
          # En UNA linea: con el escalar plegado cada salto metia un espacio
          # tras la coma ("Grep, Bash(npm test)") y la herramienta podia quedar
          # sin reconocer, o sea npm test denegado en modo sin cabeza.
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test),Bash(npm run build),Bash(npm ci),Bash(node scripts/diagnostico.mjs --local*),Bash(node pruebas/correr.mjs*),Bash(git diff*),Bash(git log*),Bash(git status*)"
            --max-turns 40
          prompt: |
            Trabajas en Mobile Legends Pick Assist, la app de Javi para elegir
            héroe en cualquiera de las cinco líneas según el draft.

            LEE PRIMERO CLAUDE.md. No es documentación de cortesía: lleva las
            reglas del proyecto y el índice de dónde está cada cosa (las reglas
            de cada zona en .claude/rules/ se cargan solas al tocarla). Antes
            de cambiar nada, lee también docs/historia/errores.md: la lista de
            fallos que ya llegaron a producción. Respeta las reglas, sobre todo
            estas:

            - Nunca propongas nada sin pasar `npm test`. Si falla, no propongas.
            - Sube la versión en package.json y documéntala en CHANGELOG.md,
              escrita para quien USA la app, no para quien lee el diff.
            - No ajustes los pesos del motor por una partida ni por intuición.
              Si tocas el motor, mídelo antes con drafts simulados.
            - Prefiere el dato a la regla escrita a mano.

            No escribas en main: deja tu trabajo en una rama y propón un pull
            request. Si algo necesita criterio que no puedes verificar -por
            ejemplo inventarle tags a un héroe que no has leído-, no lo hagas:
            dilo en un comentario y para.
