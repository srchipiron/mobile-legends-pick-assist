name: Publicar la app

on:
  push:
    branches: [main]
  workflow_run:                      # un push con GITHUB_TOKEN no dispara `push`: se escucha a los bots que cambian lo servido
    workflows: ["Actualizar datos meta", "Partidas profesionales"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    timeout-minutes: 30
    # Un bot que descartó su corrida también «completa».
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # En los JOBS: a nivel de workflow, la corrida de un bot fallido cancelaba un despliegue en marcha.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # Sin el token en .git/config mientras corre código del repositorio: aquí no se hace push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/instalar

      # El bot ya baja datos dos veces al día: solo se descargan si los del repositorio pasan de 24 h
      # (el cron llega 3-5 h tarde y lo normal son 12-17 h; muy por debajo del rancio, 72 h).
      - name: Frescura de los datos del repositorio
        id: frescura
        run: |
          node -e "const d=require('./public/data/roam-meta.json');
          const h=(Date.now()-new Date(d.generatedAt))/3.6e6;
          console.log('datos del repositorio de hace', h.toFixed(1), 'h');
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'fresca=' + (h < 24) + '\n');"

      - name: Ingesta
        if: steps.frescura.outputs.fresca != 'true'
        id: ingesta
        # A temporales (también las imágenes, desde una copia) y sin tumbar el despliegue: decide el paso de abajo.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p /tmp/objetos /tmp/heroes
          cp -r public/objetos/. /tmp/objetos/ 2>/dev/null || true
          cp -r public/heroes/. /tmp/heroes/ 2>/dev/null || true
          node scripts/ingest.mjs --rank glory --days 7 --out /tmp/nueva.json --iconos /tmp/objetos --retratos /tmp/heroes

      - name: Elegir con qué datos se publica
        # La corrida nueva si el comparador la acepta; si no, los que ya sirve Pages si son más nuevos y
        # los acepta (el despliegue no commitea); si no, los del repositorio. Con la API caída se publica igual.
        run: |
          if [ "${{ steps.ingesta.outcome }}" = "skipped" ]; then
            echo "Datos del repositorio recientes: ingesta omitida, se publica con ellos."
          elif [ "${{ steps.ingesta.outcome }}" = "success" ] \
             && node scripts/comparar-ingesta.mjs /tmp/nueva.json public/data/roam-meta.json; then
            cp /tmp/nueva.json public/data/roam-meta.json
            mkdir -p public/objetos public/heroes
            [ -d /tmp/objetos ] && cp /tmp/objetos/*.png /tmp/objetos/fuentes.json public/objetos/ 2>/dev/null || true
            [ -d /tmp/heroes ] && cp /tmp/heroes/*.jpg /tmp/heroes/fuentes.json public/heroes/ 2>/dev/null || true
            echo "Se publica con la corrida nueva."
          elif curl -fsS --max-time 60 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/roam-meta.json" -o /tmp/publicada.json \
             && node -e "const f=(p)=>Date.parse(require(p).generatedAt)||0; process.exit(f('/tmp/publicada.json') > f(process.cwd()+'/public/data/roam-meta.json') ? 0 : 1)" \
             && node scripts/comparar-ingesta.mjs /tmp/publicada.json public/data/roam-meta.json; then
            cp /tmp/publicada.json public/data/roam-meta.json
            echo "::warning::La ingesta ha fallado o resuelve menos; se publica con los datos que ya servia la app, mas nuevos que los del repositorio."
          else
            echo "::warning::La ingesta ha fallado o resuelve menos; se publica con los datos del repositorio."
          fi

      - name: Comprobar que los datos valen para publicar
        # Con más de 72 h se publica IGUAL con aviso (decidido por Javi: la app ya los sirve); sin estadísticas o sin matriz, no.
        run: |
          node -e "const d=require('./public/data/roam-meta.json');
          const h=(Date.now()-new Date(d.generatedAt))/3.6e6;
          const cruces=Object.values(d.counters??{}).reduce((n,f)=>n+Object.keys(f??{}).length,0);
          console.log('datos generados hace', h.toFixed(1), 'h ·', d.heroCount ?? 0, 'heroes ·', cruces, 'cruces');
          if (h > 72) console.log('::warning::Los datos tienen mas de 72 horas: se publica el codigo con los mismos datos que ya sirve la app');
          const hm=(Date.now()-new Date(d.relaciones?.descargada ?? d.generatedAt))/3.6e6;
          if (hm > 72) console.log('::warning::La matriz de cruces y parejas tiene', Math.round(hm), 'horas: la API no la da entera desde entonces');
          if (!(d.heroCount ?? 0)) { console.error('Sin estadisticas'); process.exit(1); }
          if (cruces < 1000) { console.error('Sin matriz de counters'); process.exit(1); }"

      # UNA definición de «las pruebas»: la de package.json. Las de navegador no (publicar no depende de un Chrome).
      - name: Pruebas (npm test)
        run: npm test

      - name: Compilar
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
