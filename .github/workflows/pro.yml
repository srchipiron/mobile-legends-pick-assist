name: Partidas profesionales

on:
  schedule:
    - cron: '40 6 * * 1'   # lunes (UTC); GitHub lo ejecuta con 3-5 h de retraso
  workflow_dispatch:

permissions:
  contents: write

# Una cada vez: dos solapadas commitearían las dos pro.json y el rebase chocaría.
concurrency:
  group: pro
  cancel-in-progress: false

jobs:
  pro:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Ingesta de Liquipedia
        # A temporales: si Liquipedia corta a mitad, lo de antes sigue intacto. Cada 429 espera minutos.
        timeout-minutes: 45
        run: node scripts/ingesta-pro.mjs --out /tmp/pro.json --out-partidas /tmp/pro-partidas.jsonl --max-peticiones 120 --max-torneos 25

      - name: Descartar si hay menos partidas que las guardadas
        run: |
          ANTES=$( [ -f historial/pro-partidas.jsonl ] && wc -l < historial/pro-partidas.jsonl || echo 0 )
          AHORA=$(wc -l < /tmp/pro-partidas.jsonl)
          echo "guardadas $ANTES · ahora $AHORA"
          if [ "$AHORA" -lt "$ANTES" ]; then echo "::error::la corrida trae menos partidas ($AHORA < $ANTES)"; exit 1; fi

      - name: Guardar
        run: |
          mkdir -p historial public/data
          cp /tmp/pro-partidas.jsonl historial/pro-partidas.jsonl
          cp /tmp/pro.json public/data/pro.json

      - name: Medir el motor contra las partidas
        # La medida va DENTRO de pro.json (el diagnóstico del móvil la enseña); con menos de 30 partidas no escribe.
        # medir-rival y ajustar-modelo, solo al log: la tendencia del rival de línea y de cada término.
        run: |
          node scripts/medir-pro.mjs --json /tmp/medicion.json || true
          node scripts/medir-rival.mjs || true
          node scripts/ajustar-modelo.mjs || true
          if [ -f /tmp/medicion.json ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('public/data/pro.json'));p.medicion=JSON.parse(fs.readFileSync('/tmp/medicion.json'));fs.writeFileSync('public/data/pro.json',JSON.stringify(p))"
          fi

      - name: Commit si hay cambios
        run: |
          git config user.name  "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          git add historial/pro-partidas.jsonl public/data/pro.json
          git diff --staged --quiet || git commit -m "datos: partidas profesionales $(date -u +%Y-%m-%d)"
          bash scripts/bots/subir.sh
