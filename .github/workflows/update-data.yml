name: Actualizar datos meta

on:
  schedule:
    - cron: '17 5,17 * * *'   # dos veces al día (UTC); GitHub lo arranca 3-5 h tarde
  workflow_dispatch:           # y a mano cuando cae un parche

permissions:
  contents: write

# Una ingesta cada vez: dos solapadas acababan en un rebase con conflicto.
concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  ingest:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Ingesta
        # A un temporal, nunca encima de los datos buenos; con tope (a medias, 140 min).
        timeout-minutes: 20
        run: node scripts/ingest.mjs --rank glory --days 7 --out /tmp/nueva.json

      - name: Descartar la corrida si resuelve menos que la guardada
        # La ingesta se degrada en silencio y por diseño: esto es lo que lo para.
        run: node scripts/comparar-ingesta.mjs /tmp/nueva.json public/data/roam-meta.json

      - name: Guardar la corrida buena
        run: cp /tmp/nueva.json public/data/roam-meta.json

      - name: Avisar de héroes nuevos sin tags
        run: |
          NUEVOS=$(node -e "const d=require('./public/data/roam-meta.json');console.log((d.newHeroes||[]).join(', '))")
          if [ -n "$NUEVOS" ]; then
            echo "::warning::Héroes sin tags en heroes.json: $NUEVOS"
          fi

      - name: Commit si hay cambios
        # Las imágenes con los datos y tras comparar: una corrida descartada no deja nada.
        run: |
          git config user.name  "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          git add public/data/roam-meta.json public/objetos public/heroes
          git diff --staged --quiet || git commit -m "datos: meta $(date -u +%Y-%m-%d)"
          bash scripts/bots/subir.sh
