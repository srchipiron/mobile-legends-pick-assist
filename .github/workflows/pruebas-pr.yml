name: Pruebas en cada propuesta

# Las pruebas sobre cada pull request ANTES de fusionar (mías, tuyas o de un agente).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  probar:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # Sin el token en .git/config mientras corre código del repositorio: aquí no se hace push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/instalar
      - run: npm test
      - name: Compilar
        run: npm run build
