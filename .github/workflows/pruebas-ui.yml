# Las pruebas de interfaz en un Chrome de verdad (pruebas/interfaz/*.e2e.mjs)
# sobre la app compilada. No las espera el despliegue: publicar no depende
# de tener un navegador, y la vigilancia mira lo publicado.
name: Pruebas de interfaz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo leer: compila y abre un navegador, no escribe nada.
permissions:
  contents: read

concurrency:
  group: pruebas-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Sin el token en .git/config mientras corre código del repositorio: aquí no se hace push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/instalar
      - name: Compilar
        run: npm run build
      # El runner trae Google Chrome; playwright-core lo usa por `channel: 'chrome'` sin descargar nada.
      - name: Pruebas de interfaz
        run: node pruebas/correr.mjs --e2e
      # supabase/esquema.sql contra un Postgres de verdad (el runner trae uno, parado; la prueba arranca el suyo).
      - name: Base de datos (Postgres)
        run: npm run test:sql
