# Las pruebas de interfaz en un Chrome de verdad (pruebas/interfaz/*.e2e.mjs)
# sobre la app compilada. No las espera el despliegue: publicar no depende
# de tener un navegador, y la vigilancia mira lo publicado. Corren en cada
# push a main y en cada pull request, y se pueden lanzar a mano.
name: Pruebas de interfaz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo leer: compila y abre un navegador, no escribe nada. Sin este bloque
# el token recibía los permisos por defecto del repositorio.
permissions:
  contents: read

concurrency:
  group: pruebas-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: node_modules (caché por lockfile)
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: modulos-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Compilar
        run: npm run build
      # El runner de GitHub trae Google Chrome; playwright-core lo usa por
      # `channel: 'chrome'` sin descargar nada.
      - name: Pruebas de interfaz
        run: node pruebas/correr.mjs --e2e
