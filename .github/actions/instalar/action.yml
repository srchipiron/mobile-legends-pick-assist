name: Instalar
description: Node 22 y node_modules en caché por el lockfile; npm ci solo si la caché no lo trae.
# node_modules ENTERO: la caché de npm de setup-node solo guarda las descargas
# y npm ci seguía en 3,7-4,7 min [M]. npm ci BORRA node_modules, así que solo
# corre sin acierto de caché, y nunca npm install (instala lo del lockfile) [D].
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - id: modulos
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: modulos-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
    - if: steps.modulos.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
